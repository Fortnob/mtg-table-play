<script>
(function () {
  var K = 'mtgtable.loadRetry';
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (!t || !t.tagName || !/^(SCRIPT|LINK)$/.test(t.tagName) || !/\/assets\//.test(t.src || t.href || '')) return;
    var last = 0;
    try { last = +sessionStorage.getItem(K) || 0; } catch (x) {}
    if (Date.now() - last > 60000) {
      try { sessionStorage.setItem(K, String(Date.now())); } catch (x) {}
      location.reload();
      return;
    }
    if (document.getElementById('load-failed')) return;
    var p = document.createElement('p');
    p.id = 'load-failed';
    p.setAttribute('role', 'alert');
    p.style.cssText = 'position:fixed;inset:auto 16px calc(16px + env(safe-area-inset-bottom, 0px));margin:0;padding:12px 16px;border-radius:8px;background:#2a1d1d;color:#f3e7e7;font:15px/1.4 system-ui,sans-serif;z-index:99999';
    p.textContent = 'MTG Table could not finish loading. Check the connection, then reload.';
    (document.body || document.documentElement).appendChild(p);
  }, true);
})();
</script>
